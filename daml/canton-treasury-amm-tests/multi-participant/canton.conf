# Local, in-memory Canton topology for the Secure V1 multi-participant validation: one
# sequencer, one mediator and one participant per role, so every role's authority and
# confirmation comes from a different node; `second_provider` hosts the
# migration rehearsal's second LP. Test-only; never point this at a live network.
canton {
  sequencers.sequencer1 {
    storage.type = memory
    public-api.port = 15001
    admin-api.port = 15002
    sequencer {
      type = reference
      config.storage.type = memory
    }
  }

  mediators.mediator1 {
    storage.type = memory
    admin-api.port = 15003
  }

  participants {
    custodian {
      storage.type = memory
      ledger-api.port = 15011
      admin-api.port = 15012
      http-ledger-api.port = 15013
    }
    operator {
      storage.type = memory
      ledger-api.port = 15021
      admin-api.port = 15022
      http-ledger-api.port = 15023
    }
    governance {
      storage.type = memory
      ledger-api.port = 15031
      admin-api.port = 15032
      http-ledger-api.port = 15033
    }
    treasury_issuer {
      storage.type = memory
      ledger-api.port = 15041
      admin-api.port = 15042
      http-ledger-api.port = 15043
    }
    stable_issuer {
      storage.type = memory
      ledger-api.port = 15051
      admin-api.port = 15052
      http-ledger-api.port = 15053
    }
    trader {
      storage.type = memory
      ledger-api.port = 15061
      admin-api.port = 15062
      http-ledger-api.port = 15063
    }
    provider {
      storage.type = memory
      ledger-api.port = 15071
      admin-api.port = 15072
      http-ledger-api.port = 15073
    }
    auditor {
      storage.type = memory
      ledger-api.port = 15081
      admin-api.port = 15082
      http-ledger-api.port = 15083
      # Canton prunes nothing newer than this; the default would keep the lineage pruning
      # check from ever pruning within a run.
      init.ledger-api.max-deduplication-duration = 10s
    }
    second_provider {
      storage.type = memory
      ledger-api.port = 15091
      admin-api.port = 15092
      http-ledger-api.port = 15093
    }
  }
}
