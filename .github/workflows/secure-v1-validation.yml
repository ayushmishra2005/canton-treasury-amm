# Install the pinned SDK from a size- and SHA-256-verified archive, build, lint and test every
# package, check the reviewed template and choice surfaces and package IDs, and run the local
# multi-participant Canton validation, including the migration rehearsal and the legacy lineage
# verification. Read-only:
# no secrets, no deployment, no upload to any ledger outside the job's own in-memory nodes.
name: Secure V1 validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secure-v1-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DPM_SDK_VERSION: 3.5.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer refuses unverified SDK archives
        run: bash daml/canton-treasury-amm-tests/scripts/check-dpm-installer.sh

      # Downloads the SDK archive and installs it only if its size and SHA-256 match the pins
      # in the script.
      - name: Install dpm with SDK ${{ env.DPM_SDK_VERSION }}
        run: |
          bash daml/canton-treasury-amm-tests/scripts/install-dpm-verified.sh "$DPM_SDK_VERSION"
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          dpm version
          java -version
          for config in daml/*/daml.yaml; do
            grep -qx "sdk-version: $DPM_SDK_VERSION" "$config" || { echo "$config is not pinned to $DPM_SDK_VERSION"; exit 1; }
          done

      - name: Build every package
        run: dpm build --all --no-cache

      - name: Lint every package
        run: |
          for package in canton-treasury-amm canton-treasury-amm-secure-v1 \
            canton-treasury-amm-live-reserve-prototype canton-treasury-amm-tests; do
            echo "== $package"
            (cd "daml/$package" && dpm damlc lint)
          done

      - name: Full test suite, no skipped or missing tests
        run: bash daml/canton-treasury-amm-tests/scripts/run-tests-strict.sh "$RUNNER_TEMP/dpm-test.log"

      - name: Migration rehearsal tests
        run: |
          bash daml/canton-treasury-amm-tests/scripts/run-tests-strict.sh "$RUNNER_TEMP/dpm-migration-test.log" \
            daml/CantonTreasuryAmm/Test/Migration.daml

      - name: Template inventory and choice surfaces
        run: bash daml/canton-treasury-amm-tests/scripts/check-prototype-choice-surface.sh

      - name: Package IDs, dependencies and upgrade check
        run: bash daml/canton-treasury-amm-tests/scripts/check-packages.sh

      - name: Record built DAR digests
        run: |
          sha256sum \
            daml/canton-treasury-amm/.daml/dist/canton-treasury-amm-0.1.0.dar \
            daml/canton-treasury-amm-secure-v1/.daml/dist/canton-treasury-amm-secure-v1-0.2.0.dar \
            daml/canton-treasury-amm-live-reserve-prototype/.daml/dist/canton-treasury-amm-live-reserve-prototype-0.1.0.dar \
            daml/canton-treasury-amm-tests/.daml/dist/canton-treasury-amm-tests-0.1.0.dar \
            lib/splice-api-token-holding-v1-1.0.0.dar lib/splice-api-token-metadata-v1-1.0.0.dar \
            > "$RUNNER_TEMP/dar-sha256.txt"
          cat "$RUNNER_TEMP/dar-sha256.txt"

      - name: Lineage verifier compiles
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python3 -m py_compile daml/canton-treasury-amm-tests/scripts/verify-legacy-lineage.py daml/canton-treasury-amm-tests/scripts/check-legacy-lineage.py

      - name: Multi-participant Canton validation
        env:
          AMM_MP_LOG_DIR: ${{ runner.temp }}/multi-participant
        run: bash daml/canton-treasury-amm-tests/scripts/run-multi-participant.sh

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-v1-validation-logs
          path: |
            ${{ runner.temp }}/dpm-test.log
            ${{ runner.temp }}/dpm-migration-test.log
            ${{ runner.temp }}/dar-sha256.txt
            ${{ runner.temp }}/multi-participant
          if-no-files-found: warn
          retention-days: 14
